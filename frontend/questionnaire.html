<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng câu hỏi sàng lọc – NOCTIA</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" style="display:flex; align-items:center; gap:10px;">
  <img src="assets/headlogo.svg" alt="NOCTIA Logo" style="height:40px; width:auto;" />
  </a>
    <span id="sectionBadge" style="font-size:15px; background:#1B3B5F; padding:6px 12px; border-radius:8px;">Đang tải...</span>
  </header>

  <main class="container">
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <p id="progressText" style="font-size:16px; color:#475569; margin-bottom:14px;"></p>

    <div class="card" id="questionCard">
      <div id="groupHeader" style="font-size:16px; color:#0D9488; font-weight:700; margin-bottom:8px;"></div>
      <h2 id="questionText" style="font-size:23px; margin-bottom:20px;">Đang tải câu hỏi...</h2>
      <div id="inputArea"></div>
      <div id="errorMsg" style="color:#991B1B; font-weight:700; margin-top:10px;"></div>
      <div class="btn-row">
        <button id="btnBack" class="btn btn-secondary">Quay lại</button>
        <button id="btnNext" class="btn btn-primary">Tiếp tục</button>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const sessionId = sessionStorage.getItem('noctia_session_id');
    if (!sessionId) window.location.href = 'consent.html';

    let flatQuestions = [];
    let currentIndex = 0;
    const answers = { PSQI: {}, HADS: {}, NOCTURIA: {} };

    async function init() {
      const data = await apiRequest('/questions');
      data.psqi.questions.forEach(q => flatQuestions.push({ ...q, instrument: 'PSQI', sectionTitle: 'Phần 1/3: Chất lượng giấc ngủ (PSQI)' }));
      data.hads.questions.forEach(q => flatQuestions.push({ ...q, instrument: 'HADS', sectionTitle: 'Phần 2/3: Sức khỏe tinh thần (HADS)' }));
      data.nocturia.questions.forEach(q => flatQuestions.push({ ...q, instrument: 'NOCTURIA', sectionTitle: 'Phần 3/3: Tiểu đêm' }));
      renderQuestion();
    }

    function renderQuestion() {
      const q = flatQuestions[currentIndex];
      const pct = Math.round(((currentIndex + 1) / flatQuestions.length) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressText').textContent = `Câu ${currentIndex + 1} / ${flatQuestions.length} (${pct}%)`;
      document.getElementById('sectionBadge').textContent = q.sectionTitle;
      document.getElementById('groupHeader').textContent = q.group || '';
      document.getElementById('questionText').textContent = q.text;
      document.getElementById('errorMsg').textContent = '';

      const area = document.getElementById('inputArea');
      area.innerHTML = '';
      const savedVal = answers[q.instrument][q.id];

      if (q.type === 'time') {
        const inp = document.createElement('input');
        inp.type = 'time';
        inp.id = 'qInput';
        inp.value = savedVal || '';
        area.appendChild(inp);
      } else if (q.type === 'number') {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.id = 'qInput';
        inp.min = q.min;
        inp.max = q.max;
        if (q.step) inp.step = q.step;
        inp.placeholder = q.placeholder || '';
        inp.value = savedVal !== undefined ? savedVal : '';
        area.appendChild(inp);
      } else {
        if (q.type === 'radio_with_text') {
          const note = document.createElement('input');
          note.type = 'text';
          note.id = 'qOtherText';
          note.placeholder = 'Ghi rõ lý do khác (nếu có, có thể bỏ trống)';
          note.value = answers[q.instrument][q.id + '_text'] || '';
          area.appendChild(note);
        }
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn' + (String(savedVal) === String(opt.value) ? ' selected' : '');
          btn.textContent = opt.label;
          btn.onclick = () => {
            answers[q.instrument][q.id] = opt.value;
            renderQuestion();
          };
          area.appendChild(btn);
        });
      }

      document.getElementById('btnBack').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
      document.getElementById('btnNext').textContent = currentIndex === flatQuestions.length - 1 ? 'Hoàn thành & Xem kết quả' : 'Tiếp tục';
    }

    document.getElementById('btnBack').onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    };

    document.getElementById('btnNext').onclick = async () => {
      const q = flatQuestions[currentIndex];
      const errEl = document.getElementById('errorMsg');
      errEl.textContent = '';

      if (q.type === 'time' || q.type === 'number') {
        const val = document.getElementById('qInput').value;
        if (q.required && (val === '' || val === null)) {
          errEl.textContent = 'Vui lòng nhập câu trả lời trước khi tiếp tục.';
          return;
        }
        answers[q.instrument][q.id] = val;
      } else {
        if (q.type === 'radio_with_text') {
          const txt = document.getElementById('qOtherText').value.trim();
          if (txt) answers[q.instrument][q.id + '_text'] = txt;
        }
        if (q.required && answers[q.instrument][q.id] === undefined) {
          errEl.textContent = 'Vui lòng chọn một phương án trả lời.';
          return;
        }
      }

      if (currentIndex < flatQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        try {
          document.getElementById('btnNext').disabled = true;
          document.getElementById('btnNext').textContent = 'Đang tính kết quả...';
          await apiRequest(`/sessions/${sessionId}/answers`, { method: 'POST', body: JSON.stringify({ instrument: 'PSQI', answers: answers.PSQI }) });
          await apiRequest(`/sessions/${sessionId}/answers`, { method: 'POST', body: JSON.stringify({ instrument: 'HADS', answers: answers.HADS }) });
          await apiRequest(`/sessions/${sessionId}/answers`, { method: 'POST', body: JSON.stringify({ instrument: 'NOCTURIA', answers: answers.NOCTURIA }) });
          await apiRequest(`/sessions/${sessionId}/submit`, { method: 'POST' });
          window.location.href = `result.html?session=${sessionId}`;
        } catch (err) {
          errEl.textContent = err.message;
          document.getElementById('btnNext').disabled = false;
          document.getElementById('btnNext').textContent = 'Hoàn thành & Xem kết quả';
        }
      }
    };

    init();
  </script>
</body>
</html>
